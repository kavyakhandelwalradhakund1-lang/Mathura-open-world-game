<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mathura Streets 3D</title>
<style>
:root{--ink:#fff;--glass:rgba(10,10,20,.55);color-scheme:dark}
html,body{margin:0;height:100%;background:#111;overflow:hidden;font-family:system-ui,sans-serif;color:var(--ink);touch-action:none;user-select:none}
#c{display:block;width:100%;height:100%}
#start{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:linear-gradient(180deg,rgba(6,10,40,.82),rgba(194,87,26,.5));overflow:hidden}
#stMain{position:relative;z-index:2;width:min(340px,92%)}
#start h1{font-size:36px;margin:4px 0;background:linear-gradient(90deg,#ffd24a,#ff8a00,#ffd24a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 10px #000)}
#stGreet{font-size:15px;opacity:.9}#stSub{letter-spacing:2px;font-size:11px;opacity:.85;margin-bottom:10px}#stInfo{font-size:12px;opacity:.9;margin:8px 0 12px;min-height:16px}
#go{display:block;width:100%;padding:15px;font-size:20px;border:0;border-radius:30px;background:linear-gradient(90deg,#ff9f00,#ff5e00);color:#fff;font-weight:800;box-shadow:0 6px 20px #ff7a0088;animation:pl 1.6s infinite}
@keyframes pl{50%{transform:scale(1.04)}}
.sb{flex:1;padding:11px;border:1px solid #fff4;border-radius:14px;background:#ffffff18;color:#fff;font:inherit;font-weight:700;margin-top:8px}
#stNew{display:block;width:100%;flex:none}.sbr{display:flex;gap:8px}
#stSk{position:absolute;left:0;right:0;bottom:0;width:100%;height:90px;z-index:1}
.fl{position:absolute;bottom:-30px;font-size:22px;animation:fu 7s linear infinite;opacity:.8;z-index:1}
@keyframes fu{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}

#pad{pointer-events:none}.g,.b{pointer-events:auto}#jr{position:fixed;width:100px;height:100px;border-radius:50%;border:2px solid #fff6;background:#ffffff14;display:none;pointer-events:none}#jk{position:fixed;width:44px;height:44px;border-radius:50%;background:#fff9;display:none;pointer-events:none}@media(pointer:coarse){#pad .g{display:none}body #pad{justify-content:flex-end}}
#vg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.4));transition:box-shadow .3s}
.hud{position:fixed;background:var(--glass);border-radius:12px;padding:5px 9px;font-size:12px;backdrop-filter:blur(6px)}
#top{left:8px;top:calc(8px + env(safe-area-inset-top,0px));max-width:54vw;line-height:1.35;opacity:.92}
#mm{right:10px;top:calc(10px + env(safe-area-inset-top,0px));padding:4px}
#mm canvas{display:block;border-radius:50%;width:92px;height:92px}#mm{border-radius:50%}#mm:after{content:"N";position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-weight:700;font-size:12px;text-shadow:0 0 4px #000}
#spd{left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:20px;font-weight:700}
#hint{left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));display:none;text-align:center}
#pad{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;padding:0 14px}
.g{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:6px}
.b{background:var(--glass);border:1px solid #fff4;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px}
.b:active{background:#ffb30088}




</style></head><body>
